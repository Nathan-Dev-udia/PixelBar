name: ondadeck
description: "OndaDeck — console-style game launcher for Android, by Onda Pixel."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  sqflite: ^2.4.2+1
  path: ^1.9.1
  package_info_plus: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/themes/wireframe_debug/
    - assets/themes/psp_xmb/

  # Background shaders (GLSL .frag) are declared here; see ARCHITECTURE.md §4.3.
  shaders:
    - shaders/wave_background.frag
